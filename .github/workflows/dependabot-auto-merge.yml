name: Dependabot auto-merge

# Patch updates from Dependabot (NuGet, Docker images and Actions) merge on their own once every check is green,
# through the same merge queue as everything else. Minor and major updates wait for a human. Updates that touch a
# CODEOWNERS path (Actions in .github/, the devcontainer's SDK image) still need the human's approval before the
# queued auto-merge can happen.
on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Automation app token
        id: app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_KEY }}
      - id: meta
        uses: dependabot/fetch-metadata@21025c705c08248db411dc16f3619e6b5f9ea21a # v2
      # For a grouped PR, update-type is the biggest change in the group, so one minor bump keeps the whole PR manual.
      - name: Turn on auto-merge for patch updates
        if: steps.meta.outputs.update-type == 'version-update:semver-patch'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr merge "$PR" -R "$GITHUB_REPOSITORY" --auto --squash
      - name: Leave the rest for a human
        if: steps.meta.outputs.update-type != 'version-update:semver-patch'
        env:
          KIND: ${{ steps.meta.outputs.update-type }}
        run: echo "::notice::${KIND:-unknown} update; not auto-merging (patch updates only)."
