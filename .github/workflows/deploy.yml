name: Deploy

# Every commit on main goes to staging, then production, using the image the merge queue built
# (orders-api:<sha>, and orders-console:<sha> for the console). The demo console reads these runs:
# each job writes its environment, image and result to the step summary.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Full commit SHA on main to deploy (default the head of the branch; it must be on main)
        type: string
        required: false

concurrency:
  group: deploy
  cancel-in-progress: false

permissions: {}

env:
  AWS_REGION: us-east-1

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Read-only preflight with orders-demo-release (SSM, ECR, ECS describe); the deploy role is only
    # for the staging and production environments.
    environment: release
    permissions:
      contents: read
      id-token: write
    outputs:
      up: ${{ steps.env.outputs.up }}
      sha: ${{ steps.sha.outputs.sha }}
      console: ${{ steps.images.outputs.console }}
      migrate_staging: ${{ steps.migrations.outputs.api_staging }}
      migrate_prod: ${{ steps.migrations.outputs.api_prod }}
    steps:
      - name: Resolve the commit
        id: sha
        env:
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          sha="${INPUT_SHA:-$GITHUB_SHA}"
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then echo "::error::sha must be a full 40-character commit SHA"; exit 1; fi
          echo "sha=$sha" | tee -a "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.sha.outputs.sha }}
          fetch-depth: 0

      # Only commits on main ship: a manual run can't deploy a branch or PR commit (its image may exist from the
      # merge queue or a preview, but it was never merged).
      - name: The commit is on main
        if: github.event_name == 'workflow_dispatch'
        env:
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error title=Not on main::$SHA isn't on main. Deploy only deploys merged commits: pick a SHA from main's history (git log origin/main), or leave sha empty to deploy main's head."
            exit 1
          fi
          echo "$SHA is on main."

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::983889169993:role/orders-demo-release
          aws-region: us-east-1

      - name: Is the environment up?
        id: env
        run: |
          if out=$(aws ssm get-parameter --name /orders-demo/cluster --query Parameter.Value --output text 2>&1); then
            echo "up=true" >>"$GITHUB_OUTPUT"; echo "Cluster: $out"
          elif grep -q ParameterNotFound <<<"$out"; then
            echo "up=false" >>"$GITHUB_OUTPUT"
            echo "environment is down, nothing to deploy"
            { echo "### Environment is down"; echo "environment is down, nothing to deploy"; } >>"$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Could not read /orders-demo/cluster: $out"; exit 1
          fi

      - name: Wait for the release images
        id: images
        if: steps.env.outputs.up == 'true'
        env:
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          wanted=(orders-api)
          # Redeploy the console only when its code changed since the running version: a restart mid-scenario
          # would lose the presenter's run (and most merges during a demo are the demo's own PRs).
          if [ -f src/Orders.Console/Dockerfile ]; then
            running=$(aws ecs describe-services --cluster orders-demo --services console \
              --query 'services[0].taskDefinition' --output text 2>/dev/null | xargs -r aws ecs describe-task-definition \
              --query 'taskDefinition.containerDefinitions[0].image' --output text --task-definition 2>/dev/null | sed -n 's/.*://p')
            if [[ "$running" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "$running^{commit}" 2>/dev/null &&
               git diff --quiet "$running" "$SHA" -- src/Orders.Console Directory.Build.props Directory.Packages.props global.json; then
              echo "Console unchanged since ${running::7}; not redeploying it."
            else
              wanted+=(orders-console); echo "console=true" >>"$GITHUB_OUTPUT"
            fi
          fi
          deadline=$(( $(date +%s) + 20 * 60 ))
          for repo in "${wanted[@]}"; do
            until aws ecr describe-images --repository-name "$repo" --image-ids imageTag="$SHA" >/dev/null 2>&1; do
              if [ "$(date +%s)" -ge "$deadline" ]; then
                echo "::error::Image $repo:$SHA did not appear within 20 minutes (did the merge queue's Release image job run?)"
                exit 1
              fi
              echo "Waiting for $repo:$SHA ..."; sleep 20
            done
            echo "Found $repo:$SHA"
          done
          {
            echo "### Release \`${SHA::7}\`"
            for repo in "${wanted[@]}"; do echo "- \`$repo:$SHA\`"; done
          } >>"$GITHUB_STEP_SUMMARY"

      # The migration task costs about a minute per environment (Fargate start, image pull), so it runs only
      # when the migrations differ from the version the environment runs now, or that version is unknown
      # (first deploy after `just env up`). The bundle is idempotent, so running it needlessly is harmless.
      - name: Do the databases need migrating?
        id: migrations
        if: steps.env.outputs.up == 'true'
        env:
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          for svc in api-staging api-prod; do
            running=$(aws ecs describe-services --cluster orders-demo --services "$svc" \
              --query 'services[0].taskDefinition' --output text 2>/dev/null | xargs -r aws ecs describe-task-definition \
              --query 'taskDefinition.containerDefinitions[0].image' --output text --task-definition 2>/dev/null | sed -n 's/.*://p')
            if [[ "$running" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "$running^{commit}" 2>/dev/null &&
               git diff --quiet "$running" "$SHA" -- src/Orders.Api/Data/Migrations; then
              echo "$svc: migrations unchanged since ${running::7}, skipping the migration task"
              echo "${svc//-/_}=false" >>"$GITHUB_OUTPUT"
            else
              echo "$svc: running ${running:-nothing}; migrating"
              echo "${svc//-/_}=true" >>"$GITHUB_OUTPUT"
            fi
          done

  staging:
    name: Staging
    needs: prepare
    if: needs.prepare.outputs.up == 'true'
    uses: ./.github/workflows/deploy-service.yml
    permissions:
      id-token: write
    with:
      label: Staging
      environment: staging
      service: api-staging
      repository: orders-api
      sha: ${{ needs.prepare.outputs.sha }}
      migrate-family: ${{ needs.prepare.outputs.migrate_staging != 'false' && 'orders-demo-migrate-staging' || '' }}
      url: https://staging.demo.joshb.app

  prod:
    name: Production
    needs: [prepare, staging]
    if: needs.prepare.outputs.up == 'true'
    uses: ./.github/workflows/deploy-service.yml
    permissions:
      id-token: write
    with:
      label: Production
      environment: production
      service: api-prod
      repository: orders-api
      sha: ${{ needs.prepare.outputs.sha }}
      migrate-family: ${{ needs.prepare.outputs.migrate_prod != 'false' && 'orders-demo-migrate-prod' || '' }}
      url: https://demo.joshb.app

  console:
    name: Console
    needs: prepare
    if: needs.prepare.outputs.up == 'true' && needs.prepare.outputs.console == 'true'
    uses: ./.github/workflows/deploy-service.yml
    permissions:
      id-token: write
    with:
      label: Console
      environment: production
      service: console
      repository: orders-console
      sha: ${{ needs.prepare.outputs.sha }}
      url: https://console.demo.joshb.app
      health-path: /health/live
      check-version: false
