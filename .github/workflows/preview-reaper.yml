name: Preview reaper

# Safety net for previews whose close event was missed (workflow failed, environment was down then up):
# finds pr-<N> services, listener rules, target groups and task definitions whose PR is no longer open
# and removes them with the same steps as closing the PR, then drops every pr_<N> database on the
# non-prod instance whose PR is not open (orders-demo-pr-dropdb task with KEEP=<open PRs>).
on:
  schedule:
    - cron: "17 9 * * *" # 3:17 AM Central (CST), every night
  workflow_dispatch:

concurrency:
  group: preview-reaper
  cancel-in-progress: false

permissions: {}

env:
  AWS_REGION: us-east-1
  CLUSTER: orders-demo

jobs:
  find:
    name: Find stale previews
    runs-on: ubuntu-latest
    # orders-demo-preview trusts pull_request and this environment, not every workflow on main.
    environment: preview-reaper
    permissions:
      id-token: write
      pull-requests: read
    outputs:
      prs: ${{ steps.stale.outputs.prs }}
    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::983889169993:role/orders-demo-preview
          aws-region: us-east-1

      - name: List preview resources and check their PRs
        id: stale
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          found=$(mktemp)
          if listener=$(aws ssm get-parameter --name /orders-demo/https-listener-arn --query Parameter.Value --output text 2>/dev/null); then
            {
            aws ecs list-services --cluster "$CLUSTER" --query 'serviceArns[]' --output text | tr '\t' '\n' \
              | sed -nE 's#.*/(pr-[0-9]+)$#\1#p'
            aws elbv2 describe-target-groups --query 'TargetGroups[].TargetGroupName' --output text | tr '\t' '\n' \
              | sed -nE 's#^(pr-[0-9]+)$#\1#p'
            aws elbv2 describe-rules --listener-arn "$listener" \
              --query 'Rules[].Conditions[].Values[]' --output text | tr '\t' '\n' \
              | sed -nE 's#^(pr-[0-9]+)\.demo\.joshb\.app$#\1#p'
            } >>"$found"
          else
            echo "Environment is down; checking task definitions only"
          fi
          aws ecs list-task-definitions --family-prefix orders-demo-pr- --status ACTIVE \
            --query 'taskDefinitionArns[]' --output text | tr '\t' '\n' \
            | sed -nE 's#.*/orders-demo-(pr-[0-9]+):[0-9]+$#\1#p' >>"$found"

          stale=()
          while read -r n; do
            state=$(gh pr view "$n" --repo "$GITHUB_REPOSITORY" --json state --jq .state 2>/dev/null || echo MISSING)
            echo "pr-$n: PR is $state"
            [ "$state" = OPEN ] || stale+=("$n")
          done < <(sed 's/^pr-//' "$found" | sort -un)
          prs=$(printf '%s\n' "${stale[@]}" | jq -cRs 'split("\n") | map(select(length > 0) | tonumber)')
          echo "prs=$prs" | tee -a "$GITHUB_OUTPUT"
          {
            echo "### Preview reaper"
            echo "Previews found: $(sort -u "$found" | grep -c . || true); stale: \`$prs\`"
          } >>"$GITHUB_STEP_SUMMARY"

  reap:
    name: Reap
    needs: find
    if: needs.find.outputs.prs != '[]'
    strategy:
      fail-fast: false
      matrix:
        pr: ${{ fromJSON(needs.find.outputs.prs) }}
    uses: ./.github/workflows/preview-down.yml
    permissions:
      id-token: write
      pull-requests: write
    with:
      pr: ${{ matrix.pr }}
      environment: preview-reaper

  databases:
    name: Drop stale databases
    needs: find
    runs-on: ubuntu-latest
    environment: preview-reaper
    permissions:
      id-token: write
      pull-requests: read
    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::983889169993:role/orders-demo-preview
          aws-region: us-east-1

      - name: Drop pr_<N> databases of PRs that are not open
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          names=(subnets preview/security-group preview/dropdb-family preview/log-group demo-run)
          params=$(aws ssm get-parameters --names "${names[@]/#//orders-demo/}" --query 'Parameters[].[Name,Value]' --output json)
          get() { jq -r --arg n "/orders-demo/$1" '.[] | select(.[0] == $n) | .[1]' <<<"$params"; }
          family=$(get preview/dropdb-family)
          if [ -z "$family" ]; then echo "Environment is down; no databases to check"; exit 0; fi
          keep=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 1000 --json number --jq '[.[].number | tostring] | join(" ")')
          echo "Open PRs (databases kept): ${keep:-none}"
          overrides=$(jq -cn --arg keep "$keep" '{containerOverrides: [{name: "dropdb", environment: [{name: "KEEP", value: $keep}]}]}')
          network="awsvpcConfiguration={subnets=[$(get subnets)],securityGroups=[$(get preview/security-group)],assignPublicIp=ENABLED}"
          run=$(aws ecs run-task --cluster "$CLUSTER" --task-definition "$family" --launch-type FARGATE \
            --started-by preview-reaper --network-configuration "$network" --overrides "$overrides" \
            --tags key=preview,value=pr-reaper key=project,value=orders-demo key=demo-run,value="$(get demo-run)")
          task=$(jq -r '.tasks[0].taskArn // empty' <<<"$run")
          if [ -z "$task" ]; then echo "::error::RunTask failed: $(jq -c .failures <<<"$run")"; exit 1; fi
          for _ in $(seq 1 120); do
            [ "$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$task" --query 'tasks[0].lastStatus' --output text)" = STOPPED ] && break
            sleep 5
          done
          desc=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$task")
          exit_code=$(jq -r '.tasks[0].containers[] | select(.name == "dropdb") | .exitCode // "none"' <<<"$desc")
          log=$(aws logs get-log-events --log-group-name "$(get preview/log-group)" --log-stream-name "dropdb/dropdb/${task##*/}" \
            --start-from-head --query 'events[].message' --output text | tr '\t' '\n' || true)
          echo "$log"
          { echo "### Stale databases"; echo '```'; echo "${log:-no output}"; echo '```'; } >>"$GITHUB_STEP_SUMMARY"
          if [ "$exit_code" != 0 ]; then
            echo "::error::The dropdb task failed (exit code $exit_code, $(jq -r '.tasks[0].stoppedReason // ""' <<<"$desc"))"; exit 1
          fi
