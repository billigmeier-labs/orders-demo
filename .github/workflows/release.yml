name: Release

# release-please keeps a release PR open from the Conventional Commits on main (version bump +
# CHANGELOG.md); merging it tags vX.Y.Z and creates the GitHub release. It uses AUTOMATION_TOKEN,
# not GITHUB_TOKEN, so its PR triggers CI (and can go through the merge queue).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.AUTOMATION_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Summary
        if: steps.release.outputs.release_created == 'true'
        env:
          TAG: ${{ steps.release.outputs.tag_name }}
        run: echo "### Released $TAG" >>"$GITHUB_STEP_SUMMARY"
