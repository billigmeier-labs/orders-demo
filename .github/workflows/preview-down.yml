name: Preview down

# Removes the preview of one PR: ECS service pr-<N>, its listener rule and target group, every revision
# of task definition orders-demo-pr-<N>, and database pr_<N> on the non-prod instance (a one-off
# orders-demo-pr-dropdb task: postgres client, preview execution role and security group).
# Called by preview.yml on close and by the reaper.
on:
  workflow_call:
    inputs:
      pr:
        description: Pull request number
        type: number
        required: true
      environment:
        description: GitHub environment for the AWS role (preview-reaper from the reaper); empty on pull_request
        type: string
        default: ""

permissions: {}

env:
  AWS_REGION: us-east-1
  CLUSTER: orders-demo

jobs:
  down:
    name: Remove preview
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      pull-requests: write
    env:
      PR: ${{ inputs.pr }}
      NAME: pr-${{ inputs.pr }}
      HOST: pr-${{ inputs.pr }}.demo.joshb.app
    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::983889169993:role/orders-demo-preview
          aws-region: us-east-1

      - name: Is the environment up?
        id: env
        run: |
          if out=$(aws ssm get-parameter --name /orders-demo/https-listener-arn --query Parameter.Value --output text 2>&1); then
            echo "up=true" >>"$GITHUB_OUTPUT"; echo "listener=$out" >>"$GITHUB_OUTPUT"
          elif grep -q ParameterNotFound <<<"$out"; then
            echo "up=false" >>"$GITHUB_OUTPUT"
            echo "environment is down: service, rule and target group went with it"
          else
            echo "::error::Could not read SSM: $out"; exit 1
          fi

      - name: Delete service ${{ env.NAME }}
        if: steps.env.outputs.up == 'true'
        run: |
          status=$(aws ecs describe-services --cluster "$CLUSTER" --services "$NAME" --query 'services[0].status' --output text)
          if [ "$status" = ACTIVE ]; then
            aws ecs delete-service --cluster "$CLUSTER" --service "$NAME" --force >/dev/null
            echo "Deleting service $NAME"
          fi
          if [ "$status" = ACTIVE ] || [ "$status" = DRAINING ]; then
            aws ecs wait services-inactive --cluster "$CLUSTER" --services "$NAME"
          fi
          echo "Service $NAME is gone"

      - name: Delete listener rule and target group
        if: steps.env.outputs.up == 'true'
        env:
          LISTENER: ${{ steps.env.outputs.listener }}
        run: |
          rules=$(aws elbv2 describe-rules --listener-arn "$LISTENER" --query Rules)
          for rule in $(jq -r --arg h "$HOST" '.[] | select(any(.Conditions[]?; (.HostHeaderConfig.Values // .Values // []) | index($h))) | .RuleArn' <<<"$rules"); do
            aws elbv2 delete-rule --rule-arn "$rule"
            echo "Deleted rule $rule"
          done
          tg=$(aws elbv2 describe-target-groups --names "$NAME" --query 'TargetGroups[0].TargetGroupArn' --output text 2>/dev/null || true)
          if [ -n "$tg" ] && [ "$tg" != None ]; then
            aws elbv2 delete-target-group --target-group-arn "$tg"
            echo "Deleted target group $tg"
          fi

      - name: Drop database pr_${{ env.PR }}
        if: steps.env.outputs.up == 'true'
        run: |
          names=(subnets preview/security-group preview/dropdb-family demo-run)
          params=$(aws ssm get-parameters --names "${names[@]/#//orders-demo/}" --query 'Parameters[].[Name,Value]' --output json)
          get() { jq -r --arg n "/orders-demo/$1" '.[] | select(.[0] == $n) | .[1]' <<<"$params"; }
          family=$(get preview/dropdb-family)
          if [ -z "$family" ]; then echo "No dropdb task in this environment; database pr_$PR stays until \`just env down\`"; exit 0; fi
          network="awsvpcConfiguration={subnets=[$(get subnets)],securityGroups=[$(get preview/security-group)],assignPublicIp=ENABLED}"
          run=$(aws ecs run-task --cluster "$CLUSTER" --task-definition "$family" --launch-type FARGATE \
            --started-by "preview-$PR" --network-configuration "$network" \
            --tags key=preview,value="$NAME" key=project,value=orders-demo key=demo-run,value="$(get demo-run)" \
            --overrides "{\"containerOverrides\":[{\"name\":\"dropdb\",\"environment\":[{\"name\":\"PR\",\"value\":\"$PR\"}]}]}")
          task=$(jq -r '.tasks[0].taskArn // empty' <<<"$run")
          if [ -z "$task" ]; then echo "::error::RunTask failed: $(jq -c .failures <<<"$run")"; exit 1; fi
          for _ in $(seq 1 120); do
            [ "$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$task" --query 'tasks[0].lastStatus' --output text)" = STOPPED ] && break
            sleep 5
          done
          desc=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$task")
          exit_code=$(jq -r '.tasks[0].containers[] | select(.name == "dropdb") | .exitCode // "none"' <<<"$desc")
          group=$(aws ssm get-parameter --name /orders-demo/preview/log-group --query Parameter.Value --output text)
          aws logs get-log-events --log-group-name "$group" --log-stream-name "dropdb/dropdb/${task##*/}" \
            --start-from-head --query 'events[].message' --output text | tr '\t' '\n' || true
          if [ "$exit_code" != 0 ]; then
            echo "::error::Dropping pr_$PR failed (exit code $exit_code, $(jq -r '.tasks[0].stoppedReason // ""' <<<"$desc"))"; exit 1
          fi

      - name: Deregister task definitions
        run: |
          # --family-prefix orders-demo-pr-1 also matches pr-12, so keep the exact family only.
          for td in $(aws ecs list-task-definitions --family-prefix "orders-demo-$NAME" --status ACTIVE \
              --query 'taskDefinitionArns[]' --output text | tr '\t' '\n' | grep -E "/orders-demo-$NAME:[0-9]+$"); do
            aws ecs deregister-task-definition --task-definition "$td" >/dev/null
            echo "Deregistered $td"
          done

      - name: Update the PR comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          marker='<!-- orders-demo-preview -->'
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n1)
          if [ -n "$id" ]; then
            body="$marker
          Preview: removed (PR closed), database \`pr_$PR\` included."
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" >/dev/null
          fi

      - name: Summary
        if: always()
        env:
          STATUS: ${{ job.status }}
          UP: ${{ steps.env.outputs.up }}
        run: |
          {
            echo "### Preview pr-$PR: $([ "$STATUS" = success ] && echo down || echo "teardown failed")"
            echo "| | |"
            echo "| --- | --- |"
            echo "| Environment | preview \`$NAME\` |"
            echo "| Removed | $([ "$UP" = true ] && echo "service, listener rule, target group, database \`pr_$PR\`, " || echo "(environment down) ")task definitions |"
            echo "| Result | $STATUS |"
          } >>"$GITHUB_STEP_SUMMARY"
