name: CI

# Runs on every PR, in the merge queue, and on main.
# The single required check is `ci-ok`, which passes only if every job it needs passed (or was skipped on purpose).
#
# Every job runs a just recipe, so `just ci` reproduces a red run locally. .NET isn't installed on the runner:
# DOTNET_IN_DOCKER=1 makes scripts/dotnet run every dotnet command in the devcontainer's SDK image
# (.devcontainer/devcontainer.json), the same image people and agents use. Docker-based steps (Testcontainers,
# Postgres, image builds, scanners) talk to the runner's Docker through the mounted socket.
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_IN_DOCKER: "1"

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # Docs-only PRs skip the test jobs. The merge queue and main always run everything.
      code: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # `every`: a file counts as code only if it matches ALL patterns (not Markdown AND not under docs/).
          predicate-quantifier: every
          filters: |
            code:
              - '!**/*.md'
              - '!docs/**'

  lint:
    name: Format and lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: just lint

  unit:
    name: Build and unit tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: just build
      - run: just test

  integration:
    name: Integration tests and coverage
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the coverage gate diffs against the PR's base
      - uses: ./.github/actions/setup
      - run: just test-all
      # The gate a PR is judged by comes from the base branch, so a PR can't loosen the check it must pass
      # (scripts/ is code-owned, but this result lands before anyone reviews).
      - name: New and changed lines are covered
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git show "$BASE:scripts/coverage-gate" > "$RUNNER_TEMP/coverage-gate"
          bash "$RUNNER_TEMP/coverage-gate" "$BASE" artifacts/coverage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage
          path: artifacts/coverage/
          retention-days: 7
          if-no-files-found: ignore

  security:
    name: Security scans
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the whole history
      - uses: ./.github/actions/setup
      - run: just secrets
      - run: just vulnerable

  image-scan:
    name: API image scan
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          nuget-cache: "false" # the image restores inside its own build
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Exposes the Actions cache token to `docker buildx` in the recipe (type=gha layer cache).
      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      - name: Trivy vulnerability database cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/trivy
          key: trivy-db-${{ github.run_id }}
          restore-keys: trivy-db-
      - run: just image-scan

  pr-rules:
    name: PR rules
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The base branch's rules, like the coverage gate: a PR can't edit the rules it's judged by.
      # (This job has only a read-only GITHUB_TOKEN and no secrets; the point is the check's verdict. It runs
      # nothing from the PR, not even the setup action: pr-rules needs only git and gh.)
      - name: PR rules from the base branch
        run: |
          git show "$BASE:scripts/pr-rules" > "$RUNNER_TEMP/pr-rules"
          bash "$RUNNER_TEMP/pr-rules" "$BASE"
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          GH_TOKEN: ${{ github.token }}

  # Agents start every task from a fresh container, so `just setup` has to stay fast and unattended.
  # This runs it on a clean runner (no NuGet cache) and reports setup-seconds=<n> in the job summary.
  setup-time:
    name: Fresh setup
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          nuget-cache: "false"
      - run: just setup-time

  # The release image is built once, in the merge queue, and tagged with the merge group's SHA, which
  # is the commit that lands on main. A push to main (an admin bypass) builds only what is missing.
  image:
    name: Release image
    if: github.event_name == 'merge_group' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    # The release environment (main and gh-readonly-queue/main/* only) is what lets this job assume
    # orders-demo-release; other workflows on main cannot push release images.
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          nuget-cache: "false"
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::983889169993:role/orders-demo-release
          aws-region: us-east-1
      - id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      - run: just release-images ${{ steps.ecr.outputs.registry }} ${{ github.sha }}

  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, lint, unit, integration, security, image-scan, pr-rules, setup-time, image]
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs passed or were skipped on purpose
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$RESULTS" | jq -e 'to_entries | any(.value.result == "failure" or .value.result == "cancelled")' >/dev/null; then
            echo "::error::A required job failed or was cancelled. Open the failed job above; each prints the file, the problem and the fix. \`just ci\` reproduces it locally."
            exit 1
          fi
