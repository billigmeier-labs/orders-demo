name: CI

# Runs on every PR, in the merge queue, and on main.
# The single required check is `ci-ok`, which passes only if every job it needs passed (or was skipped on purpose).
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            code:
              - '!**/*.md'
              - '!docs/**'

  lint:
    name: Format and lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: extractions/setup-just@v4
      - run: just lint

  unit:
    name: Build and unit tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: extractions/setup-just@v4
      - run: just build
      - run: just test

  integration:
    name: Integration tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: extractions/setup-just@v4
      - run: just test-all

  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.3 git /repo --redact --no-banner
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Vulnerable packages (high or critical fail)
        run: |
          dotnet restore Orders.slnx >/dev/null
          dotnet list Orders.slnx package --vulnerable --include-transitive | tee vuln.txt
          if grep -Eq '\b(High|Critical)\b' vuln.txt; then echo "::error::High or critical vulnerable package found"; exit 1; fi

  pr-rules:
    name: PR rules
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check the PR follows the rules in AGENTS.md
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          fail=0
          if ! grep -Eq '^(feat|fix|test|chore|docs|refactor|perf|ci|build)(\([a-z0-9-]+\))?!?: .+' <<<"$TITLE"; then
            echo "::error::PR title must be a Conventional Commit, e.g. 'feat: add order search'"; fail=1
          fi
          case "$AUTHOR" in
            claude*|*claude\[bot\]*)
              if ! grep -Eiq '(closes|fixes|resolves) #[0-9]+' <<<"$BODY"; then
                echo "::error::Agent PRs must link the issue they work on ('Closes #123')"; fail=1
              fi ;;
          esac
          added_skips=$(git diff "$BASE" "$HEAD" -- '*.cs' | grep -E '^\+.*(Skip *=|\[Fact\(Skip|\[Theory\(Skip)' || true)
          if [ -n "$added_skips" ]; then
            echo "::error::This PR adds skipped tests:"; echo "$added_skips"; fail=1
          fi
          exit $fail

  # The release image is built once, in the merge queue, and tagged with the merge group's SHA, which
  # is the commit that lands on main. A push to main (an admin bypass) builds only what is missing.
  image:
    name: Release image
    if: github.event_name == 'merge_group' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      id-token: write
    env:
      SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::983889169993:role/orders-demo-deploy
          aws-region: us-east-1
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push linux/arm64 images tagged with the commit SHA
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          {
            echo "### Release images for \`${SHA::7}\`"
            echo "| Repository | Result |"
            echo "| --- | --- |"
          } >>"$GITHUB_STEP_SUMMARY"
          build() {
            local repo=$1 dockerfile=$2 err
            if [ ! -f "$dockerfile" ]; then
              echo "$dockerfile not found, skipping $repo"
              echo "| $repo | skipped (no $dockerfile) |" >>"$GITHUB_STEP_SUMMARY"
              return
            fi
            if err=$(aws ecr describe-images --repository-name "$repo" --image-ids imageTag="$SHA" 2>&1 >/dev/null); then
              echo "$repo:$SHA already exists, not rebuilding"
              echo "| $repo | already existed |" >>"$GITHUB_STEP_SUMMARY"
              return
            elif ! grep -q ImageNotFoundException <<<"$err"; then
              echo "::error::Could not check $repo:$SHA: $err"; return 1
            fi
            docker buildx build --platform linux/arm64 -f "$dockerfile" \
              --label "org.opencontainers.image.revision=$SHA" \
              --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              -t "$REGISTRY/$repo:$SHA" --push .
            echo "| $repo | pushed \`$repo:$SHA\` |" >>"$GITHUB_STEP_SUMMARY"
          }
          build orders-api src/Orders.Api/Dockerfile
          build orders-console src/Orders.Console/Dockerfile

  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, lint, unit, integration, security, pr-rules, image]
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs passed or were skipped on purpose
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$RESULTS" | jq -e 'to_entries | any(.value.result == "failure" or .value.result == "cancelled")' >/dev/null; then
            echo "::error::A required job failed or was cancelled"; exit 1
          fi
