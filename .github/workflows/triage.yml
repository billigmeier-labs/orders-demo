name: Triage

# Every new issue from a member (or from our own automation) is scored for risk and difficulty.
# Low-risk work that isn't hard goes straight to the agent; everything else waits for a human.
on:
  issues:
    types: [opened, reopened]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number to triage
        required: true

permissions:
  contents: read
  issues: write
  id-token: write

concurrency:
  group: triage-${{ github.event.issue.number || inputs.issue }}

jobs:
  triage:
    name: triage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ISSUE: ${{ github.event.issue.number || inputs.issue }}
    steps:
      - name: Automation app token
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_KEY }}
      # Strangers' issues on this public repo are never sent to an AI automatically. The author must have write
      # access (checked through the API, because private org membership doesn't show in the event payload).
      - name: Only issues from people with write access
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          AUTHOR: ${{ github.event.issue.user.login }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then echo "allowed=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # Our own automation (incident and mutation issues) is trusted; bots have no collaborator permission to check.
          case "$AUTHOR" in "orders-automation[bot]"|"claude[bot]") echo "allowed=true" >> "$GITHUB_OUTPUT"; exit 0;; esac
          level=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$AUTHOR/permission" --jq .permission 2>/dev/null || echo none)
          case "$level" in admin|maintain|write) echo "allowed=true" >> "$GITHUB_OUTPUT";;
            *) echo "allowed=false" >> "$GITHUB_OUTPUT"; echo "::notice::$AUTHOR has '$level' access; not triaging automatically.";; esac

      - uses: actions/checkout@v4
        if: steps.gate.outputs.allowed == 'true'

      # Only the issue itself (its author passed the gate above); comments can come from anyone.
      - name: The issue to score
        if: steps.gate.outputs.allowed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo ".triage-issue.md" >> .git/info/exclude
          gh issue view "$ISSUE" -R "$GITHUB_REPOSITORY" --json title,body,author \
            --jq '"# #\(env.ISSUE): \(.title)\n\n_Opened by \(.author.login)_\n\n\(.body)"' > .triage-issue.md

      - name: Score the issue
        id: score
        if: steps.gate.outputs.allowed == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Our automation app labels issues and opens incident/mutation issues, so it starts these runs.
          allowed_bots: "orders-automation,orders-automation[bot],claude,claude[bot]"
          prompt: |
            You are the triager for this repository. Read AGENTS.md and docs/contracts.md, then read issue #${{ env.ISSUE }}
            from the file `.triage-issue.md` (don't fetch it yourself). Look at the code it would touch.

            Score it:
            - risk: "low" if it only touches application code and tests in normal ways — this includes ADDING a new
              endpoint or field, and fixing a bug in application code that has clear evidence (e.g. an incident issue
              with logs); "medium" if it CHANGES or removes existing API behaviour clients rely on, changes the shape of
              stored data, or touches concurrency/connection handling; "high" if it touches anything AGENTS.md says
              needs a human (.github, infra, migrations, auth, AGENTS.md, test thresholds) or could lose data.
              Be consistent: the same kind of change always gets the same score.
            - difficulty: "low" (a focused change in one place), "medium" (a few files, clear approach), "high" (unclear
              approach, design decisions, or large).
            Write short, plain reasons a programmer new to this repo would follow. If the issue lacks clear acceptance
            criteria, propose some.
          claude_args: >-
            --model claude-sonnet-5-5
            --max-turns 15
            --allowedTools "Read,Glob,Grep"
            --json-schema '{"type":"object","required":["risk","difficulty","reasons"],"properties":{"risk":{"enum":["low","medium","high"]},"difficulty":{"enum":["low","medium","high"]},"reasons":{"type":"string"},"acceptance_criteria":{"type":"string"}}}'

      - name: Label, explain, and route
        if: steps.gate.outputs.allowed == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          RESULT: ${{ steps.score.outputs.structured_output }}
        run: |
          risk=$(jq -r .risk <<<"$RESULT"); difficulty=$(jq -r .difficulty <<<"$RESULT")
          reasons=$(jq -r .reasons <<<"$RESULT"); criteria=$(jq -r '.acceptance_criteria // empty' <<<"$RESULT")
          gh issue edit "$ISSUE" --add-label "risk:$risk,difficulty:$difficulty"
          if [ "$risk" = low ] && [ "$difficulty" != high ]; then
            route="Safe for an agent, so it's **assigned to the agent**. No human needed."
            next=agent
          else
            route="Not safe to hand to an agent automatically, so it **waits for a human**."
            next=needs-human
          fi
          {
            echo "### Triage"
            echo "| Risk | Difficulty |"; echo "| --- | --- |"; echo "| $risk | $difficulty |"
            echo; echo "$reasons"
            if [ -n "$criteria" ]; then echo; echo "**Suggested acceptance criteria**"; echo; echo "$criteria"; fi
            echo; echo "$route"
          } > comment.md
          gh issue comment "$ISSUE" --body-file comment.md
          # Added with the automation token so the label event starts the agent workflow.
          gh issue edit "$ISSUE" --add-label "$next"
