name: Retry transient failures

# When a workflow fails because a download from GitHub or elsewhere timed out (HTTP 502/503/504),
# re-run its failed jobs, up to 3 attempts. Real failures (tests, review findings) are left alone.
on:
  workflow_run:
    workflows: [Triage, Agent, Incident, AI review, CI, Deploy, Preview, Mutation, Flaky tests]
    types: [completed]

permissions:
  actions: write

jobs:
  retry:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RUN: ${{ github.event.workflow_run.id }}
    steps:
      - name: Re-run if the failure was a timeout
        run: |
          # A run that failed before any job started (GitHub couldn't start the workflow) is also worth a retry.
          jobs=$(gh run view "$RUN" -R "$GITHUB_REPOSITORY" --json jobs --jq '.jobs | length')
          if [ "$jobs" = 0 ]; then
            echo "Run $RUN failed before starting any job; re-running it."
            sleep 30
            gh run rerun "$RUN" -R "$GITHUB_REPOSITORY"
          elif gh run view "$RUN" -R "$GITHUB_REPOSITORY" --log-failed | grep -qE 'Unexpected HTTP response: 50[234]|HTTP (error )?50[234]|returned error: 50[234]|CannotPullContainerError|i/o timeout'; then
            echo "Transient download failure; re-running failed jobs of run $RUN."
            sleep 30
            gh run rerun "$RUN" -R "$GITHUB_REPOSITORY" --failed
          else
            echo "Not a transient failure; leaving it."
          fi
