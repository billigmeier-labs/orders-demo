name: Mutation

# Nightly mutation testing with Stryker.NET. Stryker changes the API's code on purpose ("mutants"); a mutant that
# no test notices "survives", which means the tests are weak there. The results become work:
#   - one issue per file with surviving mutants (written like the agent task form, labelled mutation, agent and
#     risk:low, so the agent picks it up), updated in place on later runs and closed when none survive
#   - the overall score as a `mutation-score` notice (the console reads it) and in the job summary
#   - a needs-human issue when the score drops below thresholds.low in stryker-config.json
# The run itself never fails on a low score (thresholds.break only marks the Stryker step), so the console
# always has a latest successful run to read.
on:
  schedule:
    - cron: "17 8 * * *" # 2:17 AM Central
  workflow_dispatch:
    inputs:
      max-issues:
        description: Most new issues to open in this run (existing ones are always updated)
        default: "2"

permissions:
  contents: read

concurrency:
  group: mutation

env:
  DOTNET_IN_DOCKER: "1"
  MAX_ISSUES: ${{ inputs.max-issues || '2' }}
  MIN_SURVIVORS: 3

jobs:
  mutation:
    name: mutation
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Automation app token
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_KEY }}
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      # Stryker exits non-zero when the score is under thresholds.break; that's reported below, not a failed run.
      - name: Run Stryker
        id: stryker
        continue-on-error: true
        run: just mutation

      - name: Find the report
        id: report
        run: just mutation-report

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stryker-report
          path: StrykerOutput/*/reports/
          retention-days: 14

      # With the automation token so new issues start the agent (issues made with GITHUB_TOKEN start nothing).
      - name: Score, and open, update or close issues
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPORT: ${{ steps.report.outputs.report }}
        run: bash .github/scripts/mutation-issues.sh "$REPORT"

      - name: Below the break threshold
        if: steps.stryker.outcome == 'failure'
        run: echo "::warning title=Mutation score below break::Stryker reported the score below thresholds.break in stryker-config.json (see the summary). Not failing the nightly run."
