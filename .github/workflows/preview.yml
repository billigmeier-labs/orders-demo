name: Preview

# Each open PR from this repo gets its own copy of the API at https://pr-<N>.demo.joshb.app:
# image orders-api-preview:pr-<N>, database pr_<N> on the non-prod instance, ECS service pr-<N>.
# Closing the PR removes the service, listener rule, target group and task definitions
# (the database stays). Forks, Dependabot and release-please PRs get no preview.
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

env:
  AWS_REGION: us-east-1
  CLUSTER: orders-demo
  PR: ${{ github.event.pull_request.number }}

jobs:
  up:
    name: Preview up
    if: >-
      github.event.action != 'closed'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login != 'dependabot[bot]'
      && !startsWith(github.event.pull_request.head.ref, 'release-please--')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    env:
      HOST: pr-${{ github.event.pull_request.number }}.demo.joshb.app
      NAME: pr-${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::983889169993:role/orders-demo-preview
          aws-region: us-east-1

      - name: Is the environment up?
        id: env
        run: |
          if out=$(aws ssm get-parameter --name /orders-demo/cluster --query Parameter.Value --output text 2>&1); then
            echo "up=true" >>"$GITHUB_OUTPUT"
          elif grep -q ParameterNotFound <<<"$out"; then
            echo "up=false" >>"$GITHUB_OUTPUT"
            echo "environment is down, no preview"
            echo "### Environment is down, no preview for #$PR" >>"$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Could not read /orders-demo/cluster: $out"; exit 1
          fi

      - uses: actions/checkout@v4
        if: steps.env.outputs.up == 'true'

      - id: ecr
        if: steps.env.outputs.up == 'true'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push orders-api-preview:pr-${{ env.PR }} (linux/arm64)
        id: image
        if: steps.env.outputs.up == 'true'
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker buildx build --platform linux/arm64 -f src/Orders.Api/Dockerfile \
            --label "org.opencontainers.image.revision=$HEAD_SHA" \
            -t "$REGISTRY/orders-api-preview:$NAME" --push .
          digest=$(aws ecr describe-images --repository-name orders-api-preview --image-ids imageTag="$NAME" \
            --query 'imageDetails[0].imageDigest' --output text)
          echo "image=$REGISTRY/orders-api-preview@$digest" | tee -a "$GITHUB_OUTPUT"

      - name: Read environment settings
        id: cfg
        if: steps.env.outputs.up == 'true'
        run: |
          names=(subnets vpc-id https-listener-arn preview/security-group preview/execution-role preview/task-role
            preview/log-group preview/db-host preview/db-username preview/db-password-ref)
          params=$(aws ssm get-parameters --names "${names[@]/#//orders-demo/}" --query 'Parameters[].[Name,Value]' --output json)
          for n in "${names[@]}"; do
            v=$(jq -r --arg n "/orders-demo/$n" '.[] | select(.[0] == $n) | .[1]' <<<"$params")
            if [ -z "$v" ]; then echo "::error::Missing SSM parameter /orders-demo/$n"; exit 1; fi
            echo "$(tr '/-' '__' <<<"$n")=$v" >>"$GITHUB_OUTPUT"
          done

      - name: Register task definition orders-demo-${{ env.NAME }}
        id: td
        if: steps.env.outputs.up == 'true'
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          LOG_GROUP: ${{ steps.cfg.outputs.preview_log_group }}
          DB_HOST: ${{ steps.cfg.outputs.preview_db_host }}
          DB_USER: ${{ steps.cfg.outputs.preview_db_username }}
          DB_PASSWORD_REF: ${{ steps.cfg.outputs.preview_db_password_ref }}
          EXECUTION_ROLE: ${{ steps.cfg.outputs.preview_execution_role }}
          TASK_ROLE: ${{ steps.cfg.outputs.preview_task_role }}
        run: |
          # A copy of the staging API's definition, pointed at database pr_<N>, with the preview
          # execution and task roles (the only roles orders-demo-preview may pass: nonprod DB secret,
          # preview log group, preview AppConfig).
          staging=$(aws ecs describe-task-definition --task-definition orders-demo-api-staging)
          conn="Host=$DB_HOST;Port=5432;Database=pr_$PR;Username=$DB_USER;SSL Mode=Require"
          input=$(jq --arg family "orders-demo-$NAME" --arg img "$IMAGE" --arg conn "$conn" --arg name "$NAME" \
            --arg commit "${HEAD_SHA::7}" --arg group "$LOG_GROUP" --arg region "$AWS_REGION" --arg pw "$DB_PASSWORD_REF" \
            --arg exec "$EXECUTION_ROLE" --arg task "$TASK_ROLE" '
            def setenv($k; $v): [.[] | select(.name != $k)] + [{name: $k, value: $v}];
            .taskDefinition
            | .family = $family
            | .executionRoleArn = $exec
            | .taskRoleArn = $task
            # Keep the API container (renamed "api") and the X-Ray collector sidecar.
            | .containerDefinitions = [.containerDefinitions[]
                | select(.name == "api-staging" or .name == "otel-collector")
                | .logConfiguration = {logDriver: "awslogs", options: {
                    "awslogs-group": $group, "awslogs-region": $region, "awslogs-stream-prefix": $name}}
                | if .name == "api-staging" then
                    .name = "api"
                    | .image = $img
                    | .environment = ((.environment // [])
                        | setenv("APP_ENVIRONMENT"; "preview") | setenv("APP_VERSION"; $name)
                        | setenv("APP_COMMIT"; $commit) | setenv("SEED_DATA"; "true")
                        | setenv("APPCONFIG_ENVIRONMENT"; "preview")
                        | setenv("OTEL_SERVICE_NAME"; "orders-api-preview")
                        | setenv("ConnectionStrings__Orders"; $conn))
                    | .secrets = [{name: "PGPASSWORD", valueFrom: $pw}]
                  else . end]
            | {family, taskRoleArn, executionRoleArn, networkMode, containerDefinitions,
               requiresCompatibilities, cpu, memory, runtimePlatform}
            | with_entries(select(.value != null))
            | .tags = [{key: "preview", value: $name}, {key: "project", value: "orders-demo"}]' <<<"$staging")
          td=$(aws ecs register-task-definition --cli-input-json "$input" --query taskDefinition.taskDefinitionArn --output text)
          echo "Registered $td"
          echo "arn=$td" >>"$GITHUB_OUTPUT"

      - name: Migrate database pr_${{ env.PR }}
        if: steps.env.outputs.up == 'true'
        env:
          TD: ${{ steps.td.outputs.arn }}
          SUBNETS: ${{ steps.cfg.outputs.subnets }}
          SG: ${{ steps.cfg.outputs.preview_security_group }}
          LOG_GROUP: ${{ steps.cfg.outputs.preview_log_group }}
        run: |
          # Same image and definition, command swapped for the EF Core bundle, which creates
          # the database if it does not exist yet.
          run=$(aws ecs run-task --cluster "$CLUSTER" --task-definition "$TD" --launch-type FARGATE \
            --started-by "preview-$PR" --tags key=preview,value="$NAME" key=project,value=orders-demo \
            --overrides '{"containerOverrides":[{"name":"api","command":["./efbundle"]}]}' \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SG],assignPublicIp=ENABLED}")
          task=$(jq -r '.tasks[0].taskArn // empty' <<<"$run")
          if [ -z "$task" ]; then echo "::error::RunTask failed: $(jq -c .failures <<<"$run")"; exit 1; fi
          echo "Migration task $task"
          for _ in $(seq 1 90); do
            [ "$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$task" --query 'tasks[0].lastStatus' --output text)" = STOPPED ] && break
            sleep 10
          done
          desc=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$task")
          exit_code=$(jq -r '.tasks[0].containers[] | select(.name == "api") | .exitCode // "none"' <<<"$desc")
          echo "::group::Migration log"
          aws logs get-log-events --log-group-name "$LOG_GROUP" --log-stream-name "$NAME/api/${task##*/}" \
            --start-from-head --query 'events[].message' --output text | tr '\t' '\n' || true
          echo "::endgroup::"
          if [ "$exit_code" != 0 ]; then
            echo "::error::Migration of pr_$PR failed (exit code $exit_code, $(jq -r '.tasks[0].stoppedReason // ""' <<<"$desc"))"
            exit 1
          fi

      - name: Target group and listener rule for ${{ env.HOST }}
        id: lb
        if: steps.env.outputs.up == 'true'
        env:
          VPC: ${{ steps.cfg.outputs.vpc_id }}
          LISTENER: ${{ steps.cfg.outputs.https_listener_arn }}
        run: |
          tg=$(aws elbv2 describe-target-groups --names "$NAME" --query 'TargetGroups[0].TargetGroupArn' --output text 2>/dev/null || true)
          if [ -z "$tg" ] || [ "$tg" = None ]; then
            tg=$(aws elbv2 create-target-group --name "$NAME" --protocol HTTP --port 8080 --vpc-id "$VPC" \
              --target-type ip --health-check-path /health/ready --matcher HttpCode=200 \
              --health-check-interval-seconds 10 --health-check-timeout-seconds 5 \
              --healthy-threshold-count 2 --unhealthy-threshold-count 3 \
              --tags Key=preview,Value="$NAME" Key=project,Value=orders-demo \
              --query 'TargetGroups[0].TargetGroupArn' --output text)
            aws elbv2 modify-target-group-attributes --target-group-arn "$tg" \
              --attributes Key=deregistration_delay.timeout_seconds,Value=15 >/dev/null
            echo "Created target group $tg"
          fi
          echo "tg=$tg" >>"$GITHUB_OUTPUT"

          rules=$(aws elbv2 describe-rules --listener-arn "$LISTENER" --query Rules)
          rule=$(jq -r --arg h "$HOST" '[.[] | select(any(.Conditions[]?; (.HostHeaderConfig.Values // .Values // []) | index($h)))][0].RuleArn // empty' <<<"$rules")
          if [ -n "$rule" ]; then
            aws elbv2 modify-rule --rule-arn "$rule" --actions Type=forward,TargetGroupArn="$tg" >/dev/null
            echo "Updated rule $rule"
          else
            # Terraform owns priorities 1-30; previews start at 1000 + N and move up if taken.
            priority=$((1000 + PR))
            while jq -e --arg p "$priority" 'any(.[]; .Priority == $p)' <<<"$rules" >/dev/null; do priority=$((priority + 1)); done
            rule=$(aws elbv2 create-rule --listener-arn "$LISTENER" --priority "$priority" \
              --conditions Field=host-header,Values="$HOST" \
              --actions Type=forward,TargetGroupArn="$tg" \
              --tags Key=preview,Value="$NAME" Key=project,Value=orders-demo \
              --query 'Rules[0].RuleArn' --output text)
            echo "Created rule $rule (priority $priority)"
          fi

      - name: Create or update service ${{ env.NAME }}
        if: steps.env.outputs.up == 'true'
        env:
          TD: ${{ steps.td.outputs.arn }}
          TG: ${{ steps.lb.outputs.tg }}
          SUBNETS: ${{ steps.cfg.outputs.subnets }}
          SG: ${{ steps.cfg.outputs.preview_security_group }}
        run: |
          status=$(aws ecs describe-services --cluster "$CLUSTER" --services "$NAME" --query 'services[0].status' --output text)
          if [ "$status" = DRAINING ]; then
            aws ecs wait services-inactive --cluster "$CLUSTER" --services "$NAME"; status=INACTIVE
          fi
          # Previews run in their own security group (only the nonprod database lets it in); tasks carry
          # the service's preview=pr-<N> tag, which is what lets orders-demo-preview stop them.
          network="awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SG],assignPublicIp=ENABLED}"
          if [ "$status" = ACTIVE ]; then
            aws ecs update-service --cluster "$CLUSTER" --service "$NAME" --task-definition "$TD" --desired-count 1 \
              --network-configuration "$network" --propagate-tags SERVICE >/dev/null
            echo "Updated service $NAME"
          else
            aws ecs create-service --cluster "$CLUSTER" --service-name "$NAME" --task-definition "$TD" \
              --desired-count 1 --launch-type FARGATE --health-check-grace-period-seconds 60 \
              --network-configuration "$network" --propagate-tags SERVICE \
              --load-balancers "targetGroupArn=$TG,containerName=api,containerPort=8080" \
              --deployment-configuration "deploymentCircuitBreaker={enable=true,rollback=true},minimumHealthyPercent=100,maximumPercent=200" \
              --tags key=preview,value="$NAME" key=project,value=orders-demo >/dev/null
            echo "Created service $NAME"
          fi
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$NAME"
          # shellcheck disable=SC2016 # JMESPath literal, not shell
          primary=$(aws ecs describe-services --cluster "$CLUSTER" --services "$NAME" \
            --query 'services[0].deployments[?status==`PRIMARY`].taskDefinition | [0]' --output text)
          if [ "$primary" != "$TD" ]; then echo "::error::Preview rolled back to $primary"; exit 1; fi

      - name: Smoke test
        if: steps.env.outputs.up == 'true'
        run: |
          curl -fsS --retry 12 --retry-delay 5 --retry-all-errors --max-time 10 "https://$HOST/health/ready"; echo
          for _ in $(seq 1 12); do
            version=$(curl -fsS --max-time 10 "https://$HOST/api/version" || true)
            echo "$version"
            [ "$(jq -r '.commit // empty' <<<"$version" 2>/dev/null)" = "${HEAD_SHA::7}" ] && exit 0
            sleep 5
          done
          echo "::error::https://$HOST/api/version does not report commit ${HEAD_SHA::7}"; exit 1

      - name: Comment the preview URL on the PR
        if: steps.env.outputs.up == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          marker='<!-- orders-demo-preview -->'
          body="$marker
          Preview: https://$HOST

          Commit \`${HEAD_SHA::7}\`, database \`pr_$PR\` on the non-prod instance. Removed when the PR closes."
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" >/dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body" >/dev/null
          fi

      - name: Summary
        if: always() && steps.env.outputs.up == 'true'
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          STATUS: ${{ job.status }}
        run: |
          {
            echo "### Preview pr-$PR: $([ "$STATUS" = success ] && echo up || echo failed)"
            echo "| | |"
            echo "| --- | --- |"
            echo "| Environment | preview \`$NAME\` |"
            echo "| URL | https://$HOST |"
            echo "| Image | \`orders-api-preview:$NAME\` (\`${IMAGE##*@}\`) |"
            echo "| Commit | \`${HEAD_SHA::7}\` |"
            echo "| Database | \`pr_$PR\` |"
            echo "| Result | $STATUS |"
          } >>"$GITHUB_STEP_SUMMARY"

  down:
    name: Preview down
    if: >-
      github.event.action == 'closed'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login != 'dependabot[bot]'
      && !startsWith(github.event.pull_request.head.ref, 'release-please--')
    uses: ./.github/workflows/preview-down.yml
    permissions:
      id-token: write
      pull-requests: write
    with:
      pr: ${{ github.event.pull_request.number }}
